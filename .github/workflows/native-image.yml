name: Embedded ImageMagick

on:
  push:
    paths:
      - 'modules/core/core-image/**'
      - 'modules/core/core-api/src/main/java/com/enonic/xp/style/**'
      - 'modules/portal/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/native-image.yml'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zstd
      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: brew install sevenzip
      - name: Test bundled codecs and extraction
        run: ./gradlew :core:core-image:test --tests '*ImageMagickEncoderTest' --tests '*ImageMagickDecoderTest' --tests '*ImageMagickTransformerTest' --tests '*EmbeddedImageMagickTest'
      - name: Test style enforcement, fingerprints, and resource limits
        if: runner.os != 'Windows'
        run: ./gradlew :core:core-image:test :portal:portal-impl:test --tests '*PortalUrlGeneratorServiceImplTest' --tests '*ImageMediaHandlerTest' --tests '*ImageHandlerTest' --tests '*HmacServiceTest' --tests '*RedirectChecksumServiceTest' --tests '*MediaHashResolverTest' :core:core-content:test --tests '*YmlStyleDescriptorParserTest' :lib:lib-portal:test --tests '*UrlServiceScriptTest'
