# NoDB data plane — self-hosted / development topology (draft).
# Production cloud topology: same images, cells managed by the control plane.
services:
  nodb:
    image: enonic/nodb:latest
    ports: ["7700:7700"]
    environment:
      NODB_PG_URL: jdbc:postgresql://postgres:5432/nodb
      NODB_PG_USER: nodb
      NODB_PG_PASSWORD: nodb
      NODB_OPENSEARCH_URL: http://opensearch:9200
      NODB_S3_ENDPOINT: http://minio:9000
      NODB_S3_BUCKET: nodb-binaries
    depends_on: [postgres, opensearch, minio]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nodb
      POSTGRES_USER: nodb
      POSTGRES_PASSWORD: nodb
    command: postgres -c default_toast_compression=lz4
    volumes: [pgdata:/var/lib/postgresql/data]

  # STOCK image, pinned to the exact minor Amazon OpenSearch Service runs (3.7; it adopts
  # every OTHER 3.x minor, so the next legitimate bump is 3.9). NOT the floating ':3' tag,
  # which already points past what the managed target supports.
  #
  # No derived image and no analysis-icu: Phase 4 decision D8 moved ICU collation-key
  # computation into NoDB (engine/.../search/CollationKeyResolver), and the 44 icu_collation
  # filters were the plugin's only consumer. opensearch/Dockerfile stays in the tree as the
  # record of why it is unnecessary.
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [osdata:/usr/share/opensearch/data]

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: nodb
      MINIO_ROOT_PASSWORD: nodb-secret
    volumes: [miniodata:/data]

volumes:
  pgdata:
  osdata:
  miniodata:
