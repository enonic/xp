[versions]
postgresql = "42.7.4"
hikaricp = "6.2.1"
slf4j = "2.0.16"
junit = "5.11.3"
junit-platform = "1.11.3"
testcontainers = "1.20.4"
grpc = "1.82.2"
protobuf = "4.35.1"
javax-annotation = "1.3.2"
java-jwt = "4.6.0"
awssdk = "2.29.15"
# Phase 4 Gate A: the OpenSearch REST protocol is JSON, and (from Gate B on) so is the
# query wire itself -- the whole phase is JSON in, JSON out. Kept in lockstep with XP's
# own gradle/libs.versions.toml jackson ref.
jackson = "2.22.0"
# Phase 4 Gate A / decision D8: NoDB computes ICU collation keys for the `_orderby_<loc>`
# sub-fields itself instead of delegating to the engine's bundled analysis-icu (which the
# OpenSearch 3.7.0 image pins at the OLDER icu4j 77.1). Same version XP pins, and pinned
# HERE because NoDB owns the index generation: an ICU bump is a `+g(N+1)` rebuild, never an
# in-place change (nodb/BUILD-PHASE-4.md Gate 0(d) decision 5).
icu4j = "78.3"

[libraries]
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }

testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-minio = { module = "org.testcontainers:minio", version.ref = "testcontainers" }

awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
awssdk-sts = { module = "software.amazon.awssdk:sts" }

grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
grpc-util = { module = "io.grpc:grpc-util", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "java-jwt" }

[bundles]
testcontainers = ["testcontainers-postgresql", "testcontainers-junit-jupiter"]
grpc-server = ["grpc-netty-shaded", "grpc-protobuf", "grpc-stub", "grpc-util"]
