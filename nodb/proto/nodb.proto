// NoDB wire protocol, v0.1 draft — mirrors the storage SPI 1:1.
// This is XP's ONLY path to NoDB in every topology (dev, self-hosted, cloud).
// Tenant identity comes from the auth channel (mTLS / bearer token), never from the payload.
syntax = "proto3";

package enonic.nodb.v1;
option java_package = "com.enonic.nodb.proto.v1";
option java_multiple_files = true;

service NodeStore {
  // THE write path: version(s) + branch entrie(s) + commit + payloads, ONE transaction,
  // one Ack/seq (risk register #1). Unchanged segments referenced by hash only —
  // NEED_PAYLOAD lists unknown hashes for the client to inline and retry.
  rpc WriteBatch (WriteBatchRequest) returns (WriteBatchResponse);
  // Per-op mirror of spi.NodeStore#storeBranchEntry (Phase 1 Gate A, BUILD-PHASE-1.md
  // scope constraint #2): WriteBatch remains the native/bench-optimized batched path;
  // this is the standalone single-entry equivalent XP's per-op SPI calls map onto.
  rpc StoreBranchEntry (StoreBranchEntryRequest) returns (Ack);
  rpc DeleteBranchEntries (DeleteBranchEntriesRequest) returns (Ack);
  // Existence-only check — no row fetch. searchPreference is accepted by the SPI method
  // this mirrors but deliberately has NO field here: see the "never over the wire" note below.
  rpc ExistsBranchEntry (ExistsBranchEntryRequest) returns (ExistsResponse);
  rpc GetBranchEntry (GetBranchEntryRequest) returns (BranchEntry);
  // Multi-get by node_id: missing ids are simply absent from the stream, not an error.
  rpc GetBranchEntries (GetBranchEntriesRequest) returns (stream BranchEntry);
  // Branches containing the given node — replaces the cross-branch storage-index query
  // spi.NodeStore#getBranchesWithNode used to need ES for.
  rpc GetBranchesWithNode (GetBranchesWithNodeRequest) returns (stream BranchRef);
  rpc GetChildren (GetChildrenRequest) returns (stream BranchEntry);
  rpc StoreVersion (StoreVersionRequest) returns (Ack);
  // Vacuum/retention op (DESIGN.md §6) — exists behind the SPI for interface conformance
  // even though Phase 1 itests rarely exercise it directly.
  rpc DeleteVersion (DeleteVersionRequest) returns (Ack);
  rpc GetVersion (GetVersionRequest) returns (Version);
  rpc FindVersions (FindVersionsRequest) returns (stream Version);
  rpc StoreCommit (StoreCommitRequest) returns (Ack);
  rpc GetCommit (GetCommitRequest) returns (Commit);
  rpc PutPayload (PutPayloadRequest) returns (PutPayloadResponse); // returns content hash
  rpc GetPayload (GetPayloadRequest) returns (Payload);
}

service NodeSearch {
  // Carries the serialized XP query AST; translation to the engine DSL is server-side
  // (open question #1 in DESIGN.md — this is the preferred resolution).
  rpc Search (SearchRequest) returns (SearchResult);
  rpc AwaitRefresh (AwaitRefreshRequest) returns (Ack); // RefreshMode.SEARCH
  rpc Reindex (ReindexRequest) returns (TaskHandle);
}

service RepositoryAdmin {
  rpc CreateRepository (CreateRepositoryRequest) returns (Ack);
  rpc DeleteRepository (DeleteRepositoryRequest) returns (Ack);
  // Existence check for spi.RepositoryStorageAdmin#indexExists — returns a boolean rather
  // than throwing (unlike CreateRepository/DeleteRepository, which resolve an unknown repo
  // id via the same RepoKeys lookup that throws UnknownRepoException -> NOT_FOUND).
  rpc RepositoryExists (RepositoryExistsRequest) returns (ExistsResponse);
  rpc ListRepositories (ListRepositoriesRequest) returns (stream RepositoryInfo);
  rpc Stats (StatsRequest) returns (RepositoryStats);
}

// Committed-change stream per tenant (fed by the outbox). Runtimes subscribe for
// cache invalidation (replaces the Hazelcast event bus for storage events); also what
// makes external writers (CLI, console) safe while runtimes are live.
service ChangeFeed {
  rpc Watch (WatchRequest) returns (stream ChangeEvent);
}

// Scope model (corrected, Phase 1 gate B): repository lifecycle (RepositoryAdmin) is
// RUNTIME-scoped — in XP, repo create/delete are ordinary runtime operations (content
// projects create repos from app code); intra-tenant authz is the runtime's job.
// Operator scope guards TENANT-level operations (dump/load, snapshots) when implemented:
// RepositoryAdmin, Snapshots, and bulk transfer. Data-plane services above accept
// runtime scope. Scope is a JWT claim; enforced by the auth interceptor per service.
service BulkTransfer {
  rpc DumpTenant (DumpRequest) returns (stream DumpChunk);
  rpc LoadTenant (stream DumpChunk) returns (Ack);
  rpc ExportBranch (ExportRequest) returns (stream ExportChunk);
  rpc ImportBranch (stream ExportChunk) returns (Ack);
}

service Snapshots {
  rpc Snapshot (SnapshotRequest) returns (SnapshotInfo);
  rpc Restore (RestoreRequest) returns (Ack);
  rpc List (ListSnapshotsRequest) returns (stream SnapshotInfo);
  rpc Delete (DeleteSnapshotsRequest) returns (Ack);
}

// --- messages: field sets mirror nodb/spi Records.java / engine model records ---
// Slice-1 step 5 implemented: NodeStore.WriteBatch/GetBranchEntry/GetChildren/GetVersion/
// PutPayload/GetPayload and RepositoryAdmin.CreateRepository/DeleteRepository.
// Phase 1 Gate A (BUILD-PHASE-1.md's SPI<->proto reconciliation table) additionally
// implements: NodeStore.StoreBranchEntry/DeleteBranchEntries/ExistsBranchEntry/
// GetBranchEntries/GetBranchesWithNode/StoreVersion/DeleteVersion/StoreCommit/GetCommit
// and RepositoryAdmin.RepositoryExists — every NodeStore + RepositoryStorageAdmin method
// that has a real NoDB translation now has a 1:1 RPC. Still left as empty placeholders
// (out of Phase 1 scope entirely, not merely deferred): NodeSearch, ChangeFeed,
// BulkTransfer, Snapshots, RepositoryAdmin.ListRepositories/Stats — grpc-java's generated
// *ImplBase returns UNIMPLEMENTED for any method the server class does not override, so
// leaving those messages empty and simply not overriding the method is sufficient. Tenant
// id is NEVER a field on any request message (DESIGN.md §7.2): it comes only from the
// authenticated JWT, resolved server-side to a TenantContext.
//
// --- gRPC status contract (Phase 1 Gate A) -------------------------------------------
// Engine outcome                                            gRPC status       XP SPI boundary
// ---------------------------------------------------------------------------------------
// Unknown repo id (engine.store.UnknownRepoException,       NOT_FOUND         StorageIndexNotFoundException
//   thrown by RepoKeys#resolve for ANY op addressing a repo
//   id absent from the caller's own tenant schema — reads,
//   writes, and DeleteRepository/RepositoryExists alike)
// Duplicate repo id on CreateRepository (Postgres unique     ALREADY_EXISTS   StorageIndexExistsException
//   violation, SQLSTATE 23505 on repository.repo_id —
//   detected by column/constraint, never by message text)
// No matching row for a point lookup (GetBranchEntry/         NOT_FOUND        null (these SPI methods
//   GetVersion/GetCommit/GetPayload)                                            return @Nullable, not throw)
// Missing/invalid/expired/wrong-audience bearer token          UNAUTHENTICATED  connection-level failure
//   (TenantAuthInterceptor)                                                     (Gate B: fail fast, no retry)
// Runtime-scope token calling a tenant-level (operator) RPC     PERMISSION_DENIED connection-level failure
//   RPC (CreateRepository/DeleteRepository today)
// Any other SQLException (constraint violation, etc.)          INTERNAL         generic wrapped exception
// ---------------------------------------------------------------------------------------
// Never sent over the wire (semantic no-ops / accepted-and-ignored — documented, not
// silently dropped; see BUILD-PHASE-1.md's reconciliation table for the full reasoning):
//   * SearchPreference (LOCAL/PRIMARY): no request message below carries it. Every NoDB
//     read is a direct, transactionally-consistent Postgres read (DESIGN.md §3.3) — there
//     is no replica lag in scope for Phase 1, so the parameter has nothing to select
//     between. The XP-side nodb-client (Gate B) accepts the parameter for interface
//     conformance and never forwards it.
//   * RepositoryStorageAdmin#refresh: client-side no-op (no RPC at all) — Postgres
//     transactional visibility is a strictly STRONGER guarantee than an ES refresh, so
//     there is nothing to force. Same reasoning covers getBranchEntryByPath's SPI-mandated
//     "refresh before path lookup": branch_entry is the row of record, so the requirement
//     is trivially already satisfied.
//   * RepositoryStorageAdmin#updateSettings / #putIndexMapping / #getIndexSettings /
//     #createIndex's `mappings` param: ES-index-settings/mapping concepts with no NoDB
//     equivalent (Postgres partitions/columns are static DDL, not tunable settings or
//     dynamic mappings) — permanently N/A, client-side no-ops, not missing surface.
message Ack {
  // Max outbox seq written by this call, for AwaitRefresh (read-your-writes). Only
  // WriteBatch populates this meaningfully today (branch-entry mutations feed the
  // outbox) — the standalone per-op RPCs added in Phase 1 Gate A (StoreBranchEntry,
  // DeleteBranchEntries, StoreVersion, DeleteVersion, StoreCommit) leave it at the
  // proto3 default (0): the changefeed/outbox story for per-op calls is deferred
  // (BUILD-PHASE-1.md scope constraint #4), not silently broken — Gate A's reconciliation
  // table prescribes exactly Tx.inTenantTx -> the relevant store method for these, no more.
  uint64 outbox_seq = 1;
}

// BRANCH document equivalent — mirrors engine.model.BranchEntryRecord 1:1.
// node_data_hash/index_config_hash/acl_hash mirror the joined node_version row (Phase 1
// Gate C N+1 fix, BUILD-PHASE-1.md): the branch_entry table itself does not store these
// (only node_version does), but the XP SPI's BranchEntryRecord carries them (inherited
// from the ES-era BRANCH document, which duplicated the fields) -- rather than requiring
// clients to issue a follow-up GetVersion per read, the server joins node_version ON
// (repo_key, version_id) and populates them here in the same query. node_data_hash is
// always present on reads (NOT NULL in node_version); index_config_hash/acl_hash follow
// the same nullable-at-the-SPI-boundary convention as Version's own fields (empty wire
// string <-> SPI null). Unset/empty on write-direction messages (StoreBranchEntryRequest)
// -- the store path never reads these fields, only the read paths populate them.
message BranchEntry {
  string branch = 1;
  string node_id = 2;
  string version_id = 3;
  string node_path = 4;
  int64 timestamp_millis = 5;
  string node_data_hash = 6;
  string index_config_hash = 7;
  string acl_hash = 8;
}

// VERSION document equivalent — mirrors engine.model.VersionRecord 1:1.
message Version {
  string version_id = 1;
  string node_id = 2;
  string node_path = 3;
  int64 timestamp_millis = 4;
  string node_data_hash = 5;
  string index_config_hash = 6;
  string acl_hash = 7;
  repeated string binary_keys = 8;
  string commit_id = 9;
  map<string, string> attributes = 10;
}

// COMMIT document equivalent — mirrors engine.model.CommitRecord 1:1.
message Commit {
  string commit_id = 1;
  string message = 2;
  string committer = 3;
  int64 timestamp_millis = 4;
}

message Payload {
  string hash = 1;
  bytes bytes = 2;
}

message SearchRequest {}
message SearchResult {}

// repo_id + the full entry to upsert (branch is a field on `entry`, same shape as
// WriteBatchRequest.branch_entries — no separate branch field needed).
message StoreBranchEntryRequest {
  string repo_id = 1;
  BranchEntry entry = 2;
}
message DeleteBranchEntriesRequest {
  string repo_id = 1;
  string branch = 2;
  repeated string node_ids = 3;
}
message ExistsResponse {
  bool exists = 1;
}
// searchPreference intentionally NOT a field here — see the "never sent over the wire" note above.
message ExistsBranchEntryRequest {
  string repo_id = 1;
  string branch = 2;
  string node_id = 3;
}

// Lookup by node_id XOR node_path within (repo_id, branch); repo_id/branch always
// required, exactly one of the oneof fields set.
message GetBranchEntryRequest {
  string repo_id = 1;
  string branch = 2;
  oneof by {
    string node_id = 3;
    string node_path = 4;
  }
}

// Multi-get by node_id within (repo_id, branch); missing ids are simply absent from
// the returned stream, in no particular order (mirrors spi.NodeStore#getBranchEntries).
message GetBranchEntriesRequest {
  string repo_id = 1;
  string branch = 2;
  repeated string node_ids = 3;
}

message GetBranchesWithNodeRequest {
  string repo_id = 1;
  string node_id = 2;
}
message BranchRef {
  string branch = 1;
}

// Children of parent_path, page-windowed (from/size — OFFSET/LIMIT, mirrors
// engine.model.Page). size <= 0 is treated server-side as "use the default page size".
message GetChildrenRequest {
  string repo_id = 1;
  string branch = 2;
  string parent_path = 3;
  int32 from = 4;
  int32 size = 5;
}

message StoreVersionRequest {
  string repo_id = 1;
  Version version = 2;
}
// version_id alone: version ids are globally unique within a tenant (see
// engine.store.VersionStore#get), so no repo/branch scoping is needed for the lookup —
// same reasoning applies to delete, so DeleteVersionRequest mirrors this shape exactly.
message DeleteVersionRequest {
  string version_id = 1;
}

// version_id alone: version ids are globally unique within a tenant (see
// engine.store.VersionStore#get), so no repo/branch scoping is needed for the lookup.
message GetVersionRequest {
  string version_id = 1;
}

message FindVersionsRequest {}

message StoreCommitRequest {
  string repo_id = 1;
  Commit commit = 2;
}
// commit_id alone: node_commit's PK is commit_id (schema.sql — unpartitioned, row-scoped),
// so no repo scoping is needed for the lookup (mirrors GetVersionRequest's reasoning).
message GetCommitRequest {
  string commit_id = 1;
}

message PutPayloadRequest {
  bytes bytes = 1;
}
message PutPayloadResponse {
  string hash = 1; // content hash of the stored (or already-deduped) payload
}
message GetPayloadRequest {
  string hash = 1;
}
message AwaitRefreshRequest {}
message ReindexRequest {}
message TaskHandle {}

// Either an inline byte payload (new content) or a bare hash the caller believes NoDB
// already has (dedup — avoids re-sending bytes for content stored by an earlier write).
message PayloadRef {
  oneof ref {
    bytes inline = 1;
    string hash = 2;
  }
}

message CreateRepositoryRequest {
  string repo_id = 1;
  string settings_json = 2; // optional; empty/absent -> engine default '{}'
  // No `mappings` field: spi.RepositoryStorageAdmin#createIndex's Map<IndexType,
  // IndexMapping> parameter is a genuine ES-only concept (Postgres's node_version/
  // branch_entry columns are static DDL, not per-repo mappings) — permanently N/A for
  // NoDB, the XP-side client drops it, never a to-do.
}
message DeleteRepositoryRequest {
  string repo_id = 1;
}
message RepositoryExistsRequest {
  string repo_id = 1;
}
message ListRepositoriesRequest {}
message RepositoryInfo {}
message StatsRequest {}
message RepositoryStats {}
// Thin events: identity + metadata, never payloads or diffs (notify-then-fetch).
// At-least-once, seq-ordered; consumers dedup by seq and resume via cursor.
message WatchRequest {
  uint64 cursor = 1;            // resume after this outbox seq; 0 = from now
  string consumer_id = 2;       // registered cursor (trim protection, resync detection)
  repeated Scope scopes = 3;    // optional repo/branch/path-prefix filters
}
message Scope { string repo = 1; string branch = 2; string path_prefix = 3; }
message ChangeEvent {
  uint64 seq = 1;
  string repo = 2;
  string branch = 3;
  string node_id = 4;
  string version_id = 5;        // enough for conflict detection + lazy fetch
  string node_path = 6;
  string prev_path = 7;         // set on moves
  string op = 8;                // CREATED | UPDATED | DELETED | MOVED | PUSHED | ...
  int64  ts_millis = 9;
}
// versions + branch entries + optional commit + payloads (inline bytes for new hashes,
// hash-only for known content). repo_id is the only addressing field a caller supplies —
// tenant comes from the token, never from this message.
message WriteBatchRequest {
  string repo_id = 1;
  repeated PayloadRef payloads = 2;
  repeated Version versions = 3;
  repeated BranchEntry branch_entries = 4;
  Commit commit = 5; // optional (proto3 message-field presence; absent -> no commit row)
}
message WriteBatchResponse {
  uint64 outbox_seq = 1;                // for awaitRefresh (read-your-writes)
  repeated string need_payload = 2;     // unknown hashes — inline and retry
}
message DumpRequest {}
message DumpChunk {}
message ExportRequest {}
message ExportChunk {}
message SnapshotRequest {}
message RestoreRequest {}
message ListSnapshotsRequest {}
message SnapshotInfo {}
message DeleteSnapshotsRequest {}
