// NoDB wire protocol, v0.1 draft — mirrors the storage SPI 1:1.
// This is XP's ONLY path to NoDB in every topology (dev, self-hosted, cloud).
// Tenant identity comes from the auth channel (mTLS / bearer token), never from the payload.
//
// ── THE ONE SOURCE OF TRUTH ────────────────────────────────────────────────────────────
// This file is the only copy of the schema in the repository. Both Gradle builds generate
// from it in place — nodb/server (the separate nodb/ build) and XP's
// modules/core/core-storage-nodb-client (the root build) point their protobuf source sets
// at this directory. Do NOT vendor a copy under any <module>/src/main/proto/: both builds
// run a `checkNoVendoredProto` task that fails loudly if one reappears.
// Phase 4 gate P1, nodb/BUILD-PHASE-4.md.
//
// ── COMPATIBILITY POLICY: EXPLICIT LOCKSTEP (v0.1 draft) ───────────────────────────────
// Every producer and consumer of this protocol lives in this repository, and XP and NoDB
// are built and deployed together (dev-stack.sh rebuilds both). There is no independent
// upgrade path to preserve, so the protocol carries NO backward-compatibility guarantee:
// breaking changes — renumbering fields, changing a field's type, replacing an RPC's
// request/response shape, deleting messages — are allowed, and Phase 3.5 renumbered fields
// freely. The obligation is only that both sides are regenerated and redeployed from the
// same revision of this file. A mixed-version XP/NoDB pair is unsupported and undefined.
//
// This ENDS at Phase 6 (multi-XP runtimes, rolling upgrades, horizontally split runtimes),
// where an XP built from revision N must talk to a NoDB built from revision N±1 while both
// are live. Moving to versioned rolling compatibility then requires: no field renumbering
// or retyping, ever; additive-only changes (new optional fields, new RPCs); `reserved`
// ranges for every removed field number and name; new semantics behind a new field rather
// than a redefined one; and an explicit protocol version negotiated per connection (the
// `format_version` envelope field is the search path's precedent). Until that phase lands,
// lockstep is the policy — stated so it is a recorded decision, not an accident.
syntax = "proto3";

package enonic.nodb.v1;
option java_package = "com.enonic.nodb.proto.v1";
option java_multiple_files = true;

service NodeStore {
  // THE write path: version(s) + branch entrie(s) + commit + payloads, ONE transaction,
  // one Ack/seq (risk register #1). Unchanged segments referenced by hash only —
  // NEED_PAYLOAD lists unknown hashes for the client to inline and retry.
  rpc WriteBatch (WriteBatchRequest) returns (WriteBatchResponse);
  // Per-op mirror of spi.NodeStore#storeBranchEntry (Phase 1 Gate A, BUILD-PHASE-1.md
  // scope constraint #2): WriteBatch remains the native/bench-optimized batched path;
  // this is the standalone single-entry equivalent XP's per-op SPI calls map onto.
  rpc StoreBranchEntry (StoreBranchEntryRequest) returns (Ack);
  rpc DeleteBranchEntries (DeleteBranchEntriesRequest) returns (Ack);
  // Existence-only check — no row fetch. searchPreference is accepted by the SPI method
  // this mirrors but deliberately has NO field here: see the "never over the wire" note below.
  rpc ExistsBranchEntry (ExistsBranchEntryRequest) returns (ExistsResponse);
  rpc GetBranchEntry (GetBranchEntryRequest) returns (BranchEntry);
  // Multi-get by node_id: missing ids are simply absent from the stream, not an error.
  rpc GetBranchEntries (GetBranchEntriesRequest) returns (stream BranchEntry);
  // Branches containing the given node — replaces the cross-branch storage-index query
  // spi.NodeStore#getBranchesWithNode used to need ES for.
  rpc GetBranchesWithNode (GetBranchesWithNodeRequest) returns (stream BranchRef);
  rpc GetChildren (GetChildrenRequest) returns (stream BranchEntry);
  // Branch-entry LISTING (Phase 4 decision D2, nodb/BUILD-PHASE-4.md): the storage answer to
  // what the three NodeBranchQuery call sites used to ask the ES storage index — the delete
  // cascade's whole subtree (path prefix, path DESC) and reindex/deleteBranch's whole branch.
  // Distinct from GetChildren, which is a single generation of DIRECT children with an
  // OFFSET/LIMIT window; this walks a subtree or a branch with a KEYSET cursor on
  // (lower(node_path), node_id), the total order the branch_entry_path_lower index (migration
  // 002) serves. Unary-per-page rather than one server stream: the consumer does heavy work per
  // entry (reindex re-indexes a document for each), and a stream would hold a server-side
  // transaction and a gRPC call open for the whole walk.
  rpc ListBranchEntries (ListBranchEntriesRequest) returns (ListBranchEntriesResponse);
  rpc StoreVersion (StoreVersionRequest) returns (Ack);
  // Vacuum/retention op (DESIGN.md §6) — exists behind the SPI for interface conformance
  // even though Phase 1 itests rarely exercise it directly.
  rpc DeleteVersion (DeleteVersionRequest) returns (Ack);
  rpc GetVersion (GetVersionRequest) returns (Version);
  // The bounded storage-index version query family (Phase 3.5 Gate A): history-by-node,
  // dump/vacuum range scans, blob-key usage checks. UNARY rather than the earlier
  // `stream Version` placeholder (changed while the protocol is a v0.1 draft with all
  // producers in-repo): an accurate total_hits must ride the same response as the page —
  // the enumerated callers need it independent of page size — and every caller except
  // RepoDumper's scroll-all reads bounded pages; scroll-scale callers page via the keyset
  // cursor instead of one giant response.
  rpc FindVersions (FindVersionsRequest) returns (FindVersionsResponse);
  // Branch diff / resolve-sync-work (Phase 3.5 Gate A): DISTINCT ids of nodes present in
  // exactly one of (source, target), or in both with different version ids. Semantics
  // pinned by Gate 0 (nodb/BUILD-PHASE-3.5.md): scope root included, case-insensitive
  // paths, scope/excludes evaluated per side, excludes match exact paths only. Unary:
  // the ES path materializes the same id set in one response today, and the sole
  // existence-only caller (HasUnpublishedChildren) just sets limit = 1.
  rpc DiffBranches (DiffBranchesRequest) returns (DiffBranchesResponse);
  // Active version per branch for one node, ONE round trip (Phase 3.5 Gate A) — collapses
  // the per-branch GetBranchEntry+GetVersion loop; branch count bounds the response, so
  // unary. Branches where the node does not exist are simply absent.
  rpc GetActiveVersions (GetActiveVersionsRequest) returns (GetActiveVersionsResponse);
  rpc StoreCommit (StoreCommitRequest) returns (Ack);
  rpc GetCommit (GetCommitRequest) returns (Commit);
  // All commits of a repo (Phase 3.5 Gate A; sole caller today: RepoDumper's dump).
  // Server-streaming, matching this proto's convention for unbounded multi-row reads
  // (GetBranchEntries/GetChildren/GetPayloads).
  rpc FindCommits (FindCommitsRequest) returns (stream Commit);
  rpc PutPayload (PutPayloadRequest) returns (PutPayloadResponse); // returns content hash
  rpc GetPayload (GetPayloadRequest) returns (Payload);
  // Batched multi-hash read (DESIGN.md §2.1 bulk-read requirement, Phase 3 Gate A). Missing
  // hashes are simply absent from the stream -- not an error -- mirroring
  // GetBranchEntries/GetBranchesWithNode's existing multi-get convention in this same
  // proto; callers already hold the full requested hash set and can diff it against what
  // streamed back if they need the missing subset. (WriteBatch's need_payload list remains
  // the sharper tool for "what must I inline and retry" on the write path -- this RPC is
  // read-only.) Single-hash GetPayload is unchanged.
  rpc GetPayloads (GetPayloadsRequest) returns (stream Payload);
}

service NodeSearch {
  // Carries XP's canonical JSON query DSL plus an envelope (format version, sources,
  // paging, sort/aggregations/filters/highlight/suggest) — NOT a serialized query AST,
  // which decision 1 of nodb/BUILD-PHASE-4.md supersedes. XP normalizes at its own
  // boundary: DSL queries pass through, NoQL strings are parsed and then RENDERED to DSL by
  // a renderer that lives in XP CORE, above the storage SPI; the nodb client is a pure
  // serializer with zero query-language knowledge. Translation DSL → engine query is
  // server-side (decision 2), and the server rejects constructs outside the versioned wire
  // schema loudly rather than guessing.
  rpc Search (SearchRequest) returns (SearchResult);
  // Phase 4 Gate A. Decision 3: XP keeps BUILDING index documents (today's IndexDataService
  // output -- property values expanded per index-config into typed sub-fields) and ships them
  // here with the write; NoDB stores them and the outbox indexer applies them to OpenSearch.
  // Server-side derivation from the Phase-3 payload format is the phase's main deferral, an
  // explicit LATER swap -- fighting translation parity and doc-building parity at the same time
  // is how a port becomes unbounded. Mirrors spi.NodeSearchIndex#index(RepositoryId, Branch,
  // IndexDocumentRecord), batched: one repo+branch, N documents, one transaction, one seq.
  rpc IndexDocuments (IndexDocumentsRequest) returns (IndexAck);
  // Mirrors spi.NodeSearchIndex#delete(repo, branch, ids). Deletes the stored documents AND
  // emits DELETE outbox rows -- both halves, or a rebuild would resurrect deleted nodes.
  rpc DeleteDocuments (DeleteDocumentsRequest) returns (IndexAck);
  rpc AwaitRefresh (AwaitRefreshRequest) returns (Ack); // RefreshMode.SEARCH
  // Phase 4 Gate F. Mirrors spi.NodeSearchIndex#createIndex / #deleteIndex, and both are
  // IDEMPOTENT — which is what lets ONE pair of RPCs serve two callers that mean different things:
  //
  //   * repository lifecycle (NodeRepositoryServiceImpl#create/#delete) calls the storage admin
  //     FIRST, so CreateRepository/DeleteRepository has already made or dropped the index by the
  //     time the search half is called. Idempotence turns that second call into a no-op instead of
  //     an ALREADY_EXISTS race (Gate B decision 6 made it a client-side no-op for exactly this
  //     reason, which is why the purge below then had nothing to purge with).
  //   * PURGE (IndexServiceImpl#doPurgeSearchIndex, i.e. XP's IndexService.reindex(initialize=true))
  //     calls delete-then-create with NO storage-admin call around it, and here the two must really
  //     happen: dropping the index generation, dropping the stored documents (or a later
  //     rebuild-from-documents resurrects what the purge removed), and creating a fresh generation
  //     that the reindex then fills.
  //
  // DeleteSearchIndex answers OK for a repository that has no index, and for one whose repository
  // row is already gone (repo delete drops it, cascading search_index away).
  rpc CreateSearchIndex (CreateSearchIndexRequest) returns (Ack);
  rpc DeleteSearchIndex (DeleteSearchIndexRequest) returns (Ack);
  rpc Reindex (ReindexRequest) returns (TaskHandle);
}

service RepositoryAdmin {
  rpc CreateRepository (CreateRepositoryRequest) returns (Ack);
  rpc DeleteRepository (DeleteRepositoryRequest) returns (Ack);
  // Existence check for spi.RepositoryStorageAdmin#indexExists — returns a boolean rather
  // than throwing (unlike CreateRepository/DeleteRepository, which resolve an unknown repo
  // id via the same RepoKeys lookup that throws UnknownRepoException -> NOT_FOUND).
  rpc RepositoryExists (RepositoryExistsRequest) returns (ExistsResponse);
  rpc ListRepositories (ListRepositoriesRequest) returns (stream RepositoryInfo);
  rpc Stats (StatsRequest) returns (RepositoryStats);
}

// Committed-change stream per tenant (fed by the outbox). Runtimes subscribe for
// cache invalidation (replaces the Hazelcast event bus for storage events); also what
// makes external writers (CLI, console) safe while runtimes are live.
service ChangeFeed {
  rpc Watch (WatchRequest) returns (stream ChangeEvent);
}

// Scope model (corrected, Phase 1 gate B): repository lifecycle (RepositoryAdmin) is
// RUNTIME-scoped — in XP, repo create/delete are ordinary runtime operations (content
// projects create repos from app code); intra-tenant authz is the runtime's job.
// Operator scope guards TENANT-level operations (dump/load, snapshots) when implemented:
// RepositoryAdmin, Snapshots, and bulk transfer. Data-plane services above accept
// runtime scope. Scope is a JWT claim; enforced by the auth interceptor per service.
service BulkTransfer {
  rpc DumpTenant (DumpRequest) returns (stream DumpChunk);
  rpc LoadTenant (stream DumpChunk) returns (Ack);
  rpc ExportBranch (ExportRequest) returns (stream ExportChunk);
  rpc ImportBranch (stream ExportChunk) returns (Ack);
}

service Snapshots {
  rpc Snapshot (SnapshotRequest) returns (SnapshotInfo);
  rpc Restore (RestoreRequest) returns (Ack);
  rpc List (ListSnapshotsRequest) returns (stream SnapshotInfo);
  rpc Delete (DeleteSnapshotsRequest) returns (Ack);
}

// Phase 2 Gate A (BUILD-PHASE-2.md): binaries are content-addressed opaque blobs on S3,
// NEVER in Postgres (rejected: WAL/TOAST) -- NoDB fronts the object store so XP holds no
// object-store credentials. Data-plane, runtime-scoped (same as NodeStore): tenant comes
// from the auth interceptor, never a request field. Upload is stream-through-NoDB
// (Gate 0 decision): the client streams chunks in, NoDB assembles + hashes + HEAD-before-
// PUT dedups + PUTs to S3, and returns only once durable -- the invariant that a binary
// must be on S3 before the version referencing it commits (risk #4) falls out of this
// being a single blocking call, the same way WriteBatch already gives that property to
// Postgres writes. Download mirrors it: server-streaming bytes back out.
service Binaries {
  rpc PutBinary (stream PutBinaryChunk) returns (PutBinaryResponse);
  rpc GetBinary (GetBinaryRequest) returns (stream GetBinaryChunk);
  rpc BinaryExists (BinaryExistsRequest) returns (ExistsResponse);
  rpc DeleteBinary (DeleteBinaryRequest) returns (Ack);
  // STS-scoped presigned GET URL, restricted to the tenant's S3 prefix (DESIGN.md §7.2) --
  // a documented opt-in for browser-serving of non-transformed attachments (Gate 0
  // download-path decision); XP-internal reads always use GetBinary.
  rpc PresignGet (PresignGetRequest) returns (PresignGetResponse);
}

// --- messages: field sets mirror nodb/spi Records.java / engine model records ---
// Slice-1 step 5 implemented: NodeStore.WriteBatch/GetBranchEntry/GetChildren/GetVersion/
// PutPayload/GetPayload and RepositoryAdmin.CreateRepository/DeleteRepository.
// Phase 1 Gate A (BUILD-PHASE-1.md's SPI<->proto reconciliation table) additionally
// implements: NodeStore.StoreBranchEntry/DeleteBranchEntries/ExistsBranchEntry/
// GetBranchEntries/GetBranchesWithNode/StoreVersion/DeleteVersion/StoreCommit/GetCommit
// and RepositoryAdmin.RepositoryExists — every NodeStore + RepositoryStorageAdmin method
// that has a real NoDB translation now has a 1:1 RPC. Phase 2 Gate A (BUILD-PHASE-2.md)
// adds the whole Binaries service: PutBinary/GetBinary/BinaryExists/DeleteBinary/
// PresignGet. Phase 3 Gate A (BUILD-PHASE-3.md) adds NodeStore.GetPayloads (batched
// multi-hash read) and re-enables the node_version -> payload FK (schema-level only, not
// a new RPC — see schema.sql / the tenant migration for the constraint itself).
// Phase 3.5 Gate A (BUILD-PHASE-3.5.md) adds the storage-index query family — FindVersions
// (its empty placeholder filled in, now unary), DiffBranches, GetActiveVersions,
// FindCommits — and repo-scopes GetCommit.
// Still left as empty placeholders (out of scope entirely, not merely
// deferred): NodeSearch, ChangeFeed, BulkTransfer, Snapshots,
// RepositoryAdmin.ListRepositories/Stats — grpc-java's generated *ImplBase returns
// UNIMPLEMENTED for any method the server class does not override, so leaving those
// messages empty and simply not overriding the method is sufficient. Tenant id is NEVER a
// field on any request message (DESIGN.md §7.2): it comes only from the authenticated JWT,
// resolved server-side to a TenantContext — Binaries follows this exactly like NodeStore.
//
// --- gRPC status contract (Phase 1 Gate A; Binaries added Phase 2 Gate A) -------------
// Engine outcome                                            gRPC status       XP SPI boundary
// ---------------------------------------------------------------------------------------
// Unknown repo id (engine.store.UnknownRepoException,       NOT_FOUND         StorageIndexNotFoundException
//   thrown by RepoKeys#resolve for ANY op addressing a repo
//   id absent from the caller's own tenant schema — reads,
//   writes, and DeleteRepository/RepositoryExists alike)
// Duplicate repo id on CreateRepository (Postgres unique     ALREADY_EXISTS   StorageIndexExistsException
//   violation, SQLSTATE 23505 on repository.repo_id —
//   detected by column/constraint, never by message text)
// No matching row for a point lookup (GetBranchEntry/         NOT_FOUND        null (these SPI methods
//   GetVersion/GetCommit/GetPayload)                                            return @Nullable, not throw)
// Unknown hash (engine.binary.BinaryNotFoundException,        NOT_FOUND        analogous to a missing
//   thrown by BinaryStore#get for a hash absent under the                       BlobStore.getRecord
//   caller's own tenant S3 prefix — GetBinary/PresignGet)
// Missing/invalid/expired/wrong-audience bearer token          UNAUTHENTICATED  connection-level failure
//   (TenantAuthInterceptor)                                                     (Gate B: fail fast, no retry)
// Runtime-scope token calling a tenant-level (operator) RPC     PERMISSION_DENIED connection-level failure
//   RPC (CreateRepository/DeleteRepository today)
// Any other SQLException (constraint violation, etc.)          INTERNAL         generic wrapped exception
// ---------------------------------------------------------------------------------------
// FK violation: a version referencing a payload hash absent  FAILED_PRECONDITION N/A (a WriteBatch/
//   from `payload` (SQLSTATE 23503 foreign_key_violation on                       StoreVersion-side
//   node_version.node_data_hash/index_config_hash/acl_hash --                     invariant; no XP SPI
//   Phase 3 Gate A's re-added FK, BUILD-PHASE-3.md #10b)                          boundary maps onto
//                                                                                 this today)
//   FAILED_PRECONDITION (not NOT_FOUND): this codebase reserves NOT_FOUND for point-lookup
//   READS (GetVersion/GetBranchEntry/GetPayload/GetCommit — see above); a write-time
//   referential-integrity failure is a different thing -- "the operation was rejected
//   because the system is not in a state required for its execution" is FAILED_PRECONDITION's
//   canonical gRPC meaning, and fits exactly: the caller must store the payload before the
//   version can reference it.
//
// Never sent over the wire (semantic no-ops / accepted-and-ignored — documented, not
// silently dropped; see BUILD-PHASE-1.md's reconciliation table for the full reasoning):
//   * SearchPreference (LOCAL/PRIMARY): no request message below carries it. Every NoDB
//     read is a direct, transactionally-consistent Postgres read (DESIGN.md §3.3) — there
//     is no replica lag in scope for Phase 1, so the parameter has nothing to select
//     between. The XP-side nodb-client (Gate B) accepts the parameter for interface
//     conformance and never forwards it.
//   * RepositoryStorageAdmin#refresh: client-side no-op (no RPC at all) — Postgres
//     transactional visibility is a strictly STRONGER guarantee than an ES refresh, so
//     there is nothing to force. Same reasoning covers getBranchEntryByPath's SPI-mandated
//     "refresh before path lookup": branch_entry is the row of record, so the requirement
//     is trivially already satisfied.
//   * RepositoryStorageAdmin#updateSettings / #putIndexMapping / #getIndexSettings /
//     #createIndex's `mappings` param: ES-index-settings/mapping concepts with no NoDB
//     equivalent (Postgres partitions/columns are static DDL, not tunable settings or
//     dynamic mappings) — permanently N/A, client-side no-ops, not missing surface.
message Ack {
  // Max outbox seq written by this call, for AwaitRefresh (read-your-writes).
  //
  // Phase 4 Gate A closed risk 10a: EVERY write path that changes branch-entry state now emits
  // outbox rows in its own transaction and reports the seq here. Previously only WriteBatch did,
  // so a node written through the standalone StoreBranchEntry / DeleteBranchEntries RPCs
  // committed to Postgres and was never seen by the indexer — nothing errored, the node simply
  // never appeared in search, which is precisely the failure a "can lag but never miss"
  // contract exists to make impossible.
  //
  // Still 0, correctly: StoreVersion, DeleteVersion, StoreCommit. A version or commit row with
  // no branch-entry change is not visible in any branch and has no search-document of its own,
  // so there is nothing for the indexer to apply. (When the change feed lands — DESIGN §7.3 —
  // it may want its own op vocabulary for these; that is a feed concern, not an index one.)
  uint64 outbox_seq = 1;
}

// BRANCH document equivalent — mirrors engine.model.BranchEntryRecord 1:1.
// node_data_hash/index_config_hash/acl_hash mirror the joined node_version row (Phase 1
// Gate C N+1 fix, BUILD-PHASE-1.md): the branch_entry table itself does not store these
// (only node_version does), but the XP SPI's BranchEntryRecord carries them (inherited
// from the ES-era BRANCH document, which duplicated the fields) -- rather than requiring
// clients to issue a follow-up GetVersion per read, the server joins node_version ON
// (repo_key, version_id) and populates them here in the same query. node_data_hash is
// always present on reads (NOT NULL in node_version); index_config_hash/acl_hash follow
// the same nullable-at-the-SPI-boundary convention as Version's own fields (empty wire
// string <-> SPI null). Unset/empty on write-direction messages (StoreBranchEntryRequest)
// -- the store path never reads these fields, only the read paths populate them.
message BranchEntry {
  string branch = 1;
  string node_id = 2;
  string version_id = 3;
  string node_path = 4;
  int64 timestamp_millis = 5;
  string node_data_hash = 6;
  string index_config_hash = 7;
  string acl_hash = 8;
}

// VERSION document equivalent — mirrors engine.model.VersionRecord 1:1.
message Version {
  string version_id = 1;
  string node_id = 2;
  string node_path = 3;
  int64 timestamp_millis = 4;
  string node_data_hash = 5;
  string index_config_hash = 6;
  string acl_hash = 7;
  repeated string binary_keys = 8;
  string commit_id = 9;
  map<string, string> attributes = 10;
}

// COMMIT document equivalent — mirrors engine.model.CommitRecord 1:1.
message Commit {
  string commit_id = 1;
  string message = 2;
  string committer = 3;
  int64 timestamp_millis = 4;
}

message Payload {
  string hash = 1;
  bytes bytes = 2;
}

// --- NodeSearch query path (Phase 4 Gate B) -------------------------------------------
//
// The DSL IS the wire format (decision 1). Every query-language member below is an opaque
// JSON document produced by XP core's QueryExpr -> DSL renderer, which sits ABOVE the
// storage SPI; the client that fills this message in is a pure serializer and the server
// owns the DSL -> engine translation. Consequences worth stating, because they are what the
// field list encodes:
//
//   * Field names arrive post-IndexPath (lowercased, trimmed) and WITHOUT value-type
//     postfixes. Resolving `data.title` to `data.title._text`/`._datetime`/... is the
//     server's job (IndexFields), so the postfix table exists in exactly one place.
//   * `sources` is a LIST of (repo, branch, principals) triples because XP's multi-repo
//     queries carry PER-SOURCE principal sets. One request, N indices, the ACL filter
//     applied per index. All sources resolve under the token's tenant: multi-repo never
//     means multi-tenant.
//   * `branch` is CASE-PRESERVED. ES matched branches with an IdFilter on _type precisely
//     to avoid ValueFilter's lowercasing; lowercasing here would be a silent behaviour
//     change.
//   * The ACL filter is NEVER absent, not even for role:system.admin. The ES path skipped
//     it entirely for admins; DESIGN.md 7.2 replaces that with an admin read-key injected
//     into every document, so `principals` is always authoritative and an empty set is
//     fail-closed (user:system:anonymous), never match-all.
//   * DELIBERATELY ABSENT: search_preference (structurally always null on the search path),
//     any filter-mode / ACL-bypass flag (no such concept exists — admin is an asserted
//     principal), store_type (branch/version/commit queries are answered from Postgres, not
//     from a search index, so they never reach this RPC), and the dead filter.cache flag.
message SearchSourceRef {
  string repo_id = 1;
  string branch = 2;
  repeated string principals = 3;
}

message SearchRequest {
  uint32 format_version = 1;
  repeated SearchSourceRef sources = 2;
  string query = 3;                      // canonical DSL; ALWAYS present (empty query => {"matchAll":{}})
  // Applied inside bool.filter together with the ACL filter. Kept SEPARATE from
  // post_filters, which occupy the engine's own post-filter slot: merging them would make
  // post-filters affect aggregations, which is the one thing they must not do.
  repeated string query_filters = 4;
  repeated string post_filters = 5;
  repeated string sort = 6;              // ALWAYS an array; every element carries an explicit `direction`
  // Gate E. Canonical aggregation config, keyed and SORTED by aggregation name:
  //   {"<name>": {"<type>": {..params..}, "aggregations": {..nested..}}}
  // <type> is one of terms | stats | min | max | valueCount | numericRange | dateRange |
  // geoDistance | histogram | dateHistogram, params carry XP's own spelling (minDocCount,
  // extendedBounds), and field names are unpostfixed -- the server resolves the sub-field from
  // the aggregation TYPE (terms/valueCount -> text, metrics/histogram -> number, the date
  // families -> datetime, geoDistance -> geopoint). `aggregations` is legal only on the six
  // BUCKET types; a sub-aggregation under a metric type is rejected, not dropped.
  string aggregations = 7;
  string suggest = 8;                    // Gate D
  string highlight = 9;                  // Gate D
  int32 from = 10;
  int32 size = 11;                       // -1 = ALL (search_after/PIT on the server)
  int32 batch_size = 12;                 // page size when size = -1
  bool explain = 13;
  string search_optimizer = 14;          // SPEED | ACCURACY
  repeated string return_fields = 15;
  // Reserved for the later register-once optimization: principal sets are small (~100 bytes)
  // but highly stable per request, so a digest would let the server cache the resolved
  // filter. Reserved rather than added, because it needs per-connection server state that
  // collides with Phase 6's horizontally split runtimes — and because reserving it now keeps
  // adding it later from being a format break.
  reserved 16;
  reserved "principals_digest";
}

message SearchResult {
  repeated SearchHit hits = 1;
  uint64 total_hits = 2;
  float max_score = 3;                   // NaN when results are sorted by field, matching today's behaviour
  // Gate E, and the one response member that carries EXPLICIT TYPE TAGS (D9). An ARRAY, in the
  // request's (name-sorted) order:
  //   [{"name":..,"type":..,"keyType":"string|double|instant|none",
  //     "buckets":[{"key":..,"docCount":..,"aggregations":[..], <typed extras>}]}]
  // The tags exist because XP's AggregationsFactory discriminates results by `instanceof` on
  // Elasticsearch INTERNAL classes -- a date histogram is told from a numeric one ONLY by
  // `InternalHistogram` preceding `Histogram` in that chain -- and a JSON response has no such
  // identity: terms, histogram, date_histogram and range all come back as {"buckets": [...]}.
  // The kind is therefore never inferred; the server copies it from the REQUEST, which it still
  // holds, and the client's decoder is a table lookup on the tag with no type identity in it.
  // Typed extras per kind: keyMillis (dateHistogram), fromMillis/toMillis (dateRange),
  // from/to (numericRange, geoDistance). An ABSENT metric or bound is the "no documents" case;
  // the client restores the sentinel Elasticsearch's own result objects carried (min +Inf, max
  // -Inf, avg NaN, an open numeric/geo bound +-Inf, an open DATE bound null), because JSON has
  // no literal for any of them.
  string aggregations = 4;
  string suggestions = 5;                // Gate D
}

// Attribution is EXPLICIT. The ES path derived the repo by string-slicing _index and the
// branch from _type; under generational index names (<tenant>-<repo>+g<N>) that breaks, and
// DESIGN.md 5 forbids parsing a name back. These are the _repo/_branch document fields.
message SearchHit {
  string id = 1;                         // bare node id, never the composite <nodeId>@<branch> _id
  string repo_id = 2;
  string branch = 3;
  float score = 4;
  repeated ReturnValue return_values = 5;
  repeated string sort_values = 6;
  repeated HighlightedProperty highlights = 7;
  Explanation explanation = 8;
}

message ReturnValue {
  string name = 1;                       // canonical (unpostfixed) field name, as requested
  repeated IndexValue values = 2;
}

message HighlightedProperty {
  string name = 1;
  repeated string fragments = 2;
}

message Explanation {
  float value = 1;
  string description = 2;
  repeated Explanation details = 3;
}

// repo_id + the full entry to upsert (branch is a field on `entry`, same shape as
// WriteBatchRequest.branch_entries — no separate branch field needed).
message StoreBranchEntryRequest {
  string repo_id = 1;
  BranchEntry entry = 2;
}
message DeleteBranchEntriesRequest {
  string repo_id = 1;
  string branch = 2;
  repeated string node_ids = 3;
}
message ExistsResponse {
  bool exists = 1;
}
// searchPreference intentionally NOT a field here — see the "never sent over the wire" note above.
message ExistsBranchEntryRequest {
  string repo_id = 1;
  string branch = 2;
  string node_id = 3;
}

// Lookup by node_id XOR node_path within (repo_id, branch); repo_id/branch always
// required, exactly one of the oneof fields set.
message GetBranchEntryRequest {
  string repo_id = 1;
  string branch = 2;
  oneof by {
    string node_id = 3;
    string node_path = 4;
  }
}

// Multi-get by node_id within (repo_id, branch); missing ids are simply absent from
// the returned stream, in no particular order (mirrors spi.NodeStore#getBranchEntries).
message GetBranchEntriesRequest {
  string repo_id = 1;
  string branch = 2;
  repeated string node_ids = 3;
}

message GetBranchesWithNodeRequest {
  string repo_id = 1;
  string node_id = 2;
}
message BranchRef {
  string branch = 1;
}

// Children of parent_path, page-windowed (from/size — OFFSET/LIMIT, mirrors
// engine.model.Page). size <= 0 is treated server-side as "use the default page size".
message GetChildrenRequest {
  string repo_id = 1;
  string branch = 2;
  string parent_path = 3;
  int32 from = 4;
  int32 size = 5;
}

// Phase 4 decision D2 — one page of a branch-entry walk. path_prefix empty = the whole
// branch; otherwise the STRICT subtree below path_prefix (path_prefix itself excluded, which
// is what DeleteNodeCommand's `like '<path>/*'` means). Path predicates and the keyset are
// evaluated on lower(node_path), matching both the lowercased ES path field and NodePath's
// case-insensitive equality. after_path/after_node_id are the EXCLUSIVE keyset continuation
// (the last row of the previous page, as returned in next_after_*); both empty = first page,
// and only a first page carries total_hits (one indexed count per walk, not per page).
message ListBranchEntriesRequest {
  string repo_id = 1;
  string branch = 2;
  string path_prefix = 3;
  BranchEntryOrder order = 4;
  string after_path = 5;
  string after_node_id = 6;
  int32 page_size = 7;
}
enum BranchEntryOrder {
  BRANCH_ENTRY_ORDER_PATH_ASC = 0;   // parents before children (reindex, deleteBranch)
  BRANCH_ENTRY_ORDER_PATH_DESC = 1;  // children before parents (the delete cascade)
}
message ListBranchEntriesResponse {
  int64 total_hits = 1;              // first page only (request carries no cursor)
  repeated BranchEntry entries = 2;
  string next_after_path = 3;        // lower(node_path) of the last returned row
  string next_after_node_id = 4;
  bool has_more = 5;                 // server probed one row beyond the page — no empty final round trip
}

message StoreVersionRequest {
  string repo_id = 1;
  Version version = 2;
}
// Repo-scoped (Phase 3.5 gate P2): version identity is (repo_key, version_id) — the same
// version_id string may legitimately exist in more than one repo of a tenant, so get and
// delete both carry the repo and the server predicates on repo_key, never version_id alone.
message DeleteVersionRequest {
  string repo_id = 1;
  string version_id = 2;
}

// See DeleteVersionRequest: version identity is (repo_key, version_id), so the lookup
// carries the repo.
message GetVersionRequest {
  string repo_id = 1;
  string version_id = 2;
}

// Phase 3.5 Gate A — mirrors engine.model.VersionQuery. All filter fields are optional;
// the proto3 default (empty string / 0 / absent message) means "no predicate". Bound
// semantics mirror the XP callers exactly: ts_floor is INCLUSIVE (RangeFilter.from),
// ts_ceiling is INCLUSIVE (RangeFilter.to), version_id_after is EXCLUSIVE
// (RangeFilter.gt), and cursor is the exclusive keyset continuation for
// ORDER_TS_DESC_ID_ASC. size: 0 = count-only (proto3 default deliberately equals the
// cheapest form), -1 = all rows; from/size page otherwise. total_hits in the response is
// accurate regardless of the paging window.
message FindVersionsRequest {
  string repo_id = 1;
  string node_id = 2;
  int64 ts_floor_millis = 3;
  int64 ts_ceiling_millis = 4;
  string version_id_after = 5;
  BlobKeyTerm blob_key = 6;
  VersionCursor cursor = 7;
  VersionOrder order = 8;
  int32 from = 9;
  int32 size = 10;
}
// Which node_version column a blob-key term matches: binary_keys array containment
// (SegmentVacuum) vs node_data_hash equality (IsBlobUsedByVersion).
message BlobKeyTerm {
  string blob_key = 1;
  BlobKeyField field = 2;
}
enum BlobKeyField {
  BLOB_KEY_FIELD_BINARY_KEYS = 0;
  BLOB_KEY_FIELD_NODE_DATA_HASH = 1;
}
// Keyset continuation for ORDER_TS_DESC_ID_ASC: the (ts, version_id) of the last row
// already seen; the response resumes strictly after it.
message VersionCursor {
  int64 ts_millis = 1;
  string version_id = 2;
}
enum VersionOrder {
  VERSION_ORDER_UNORDERED = 0;       // count-only / containment checks
  VERSION_ORDER_TS_DESC_ID_ASC = 1;  // history: ts DESC, version_id ASC tiebreaker
  VERSION_ORDER_ID_ASC = 2;          // vacuum keyset
}
message FindVersionsResponse {
  int64 total_hits = 1;
  repeated Version versions = 2;
}

// See the DiffBranches rpc comment for the pinned semantics. path_scope empty = whole
// branch; exclude_paths match exact paths only (case-insensitively); limit <= 0 = all
// ids, limit = 1 = existence-only probe.
message DiffBranchesRequest {
  string repo_id = 1;
  string source_branch = 2;
  string target_branch = 3;
  string path_scope = 4;
  repeated string exclude_paths = 5;
  int32 limit = 6;
}
message DiffBranchesResponse {
  repeated string node_ids = 1;
}

message GetActiveVersionsRequest {
  string repo_id = 1;
  string node_id = 2;
  repeated string branches = 3;
}
message ActiveVersion {
  string branch = 1;
  Version version = 2;
}
message GetActiveVersionsResponse {
  repeated ActiveVersion active_versions = 1;
}

message StoreCommitRequest {
  string repo_id = 1;
  Commit commit = 2;
}
// Repo-scoped (Phase 3.5 Gate A, closing the Gate 0 holdout): node_commit's PK is
// commit_id alone (schema.sql — unpartitioned) so no data collision exists within a
// tenant, but addressing must be repo-scoped like version identity under gate P2 — the
// server predicates on repo_key, never commit_id alone. repo_id field 1, mirroring
// Get/DeleteVersionRequest.
message GetCommitRequest {
  string repo_id = 1;
  string commit_id = 2;
}
message FindCommitsRequest {
  string repo_id = 1;
}

message PutPayloadRequest {
  bytes bytes = 1;
}
message PutPayloadResponse {
  string hash = 1; // content hash of the stored (or already-deduped) payload
}
message GetPayloadRequest {
  string hash = 1;
}
// Batched multi-hash read (Phase 3 Gate A) — see GetPayloads' service-level doc comment
// for the missing-hash convention (simply absent from the response stream).
message GetPayloadsRequest {
  repeated string hashes = 1;
}

// --- Binaries (Phase 2 Gate A): opaque content-addressed blobs on S3, distinct from the
// structured `payload` pool above -- see nodb/engine/.../binary/BinaryStore.java for the
// key layout (<bucket>/<tenant>/binary/<sha256>) and dedup semantics. Chunk size is
// client-chosen for PutBinary (no fixed size enforced wire-side, only a total-bytes cap);
// GetBinary emits fixed-size chunks server-side (see BinariesService.CHUNK_SIZE).
message PutBinaryChunk {
  bytes chunk = 1;
}
message PutBinaryResponse {
  string hash = 1; // "sha256:<hex>", dedup-if-already-seen under this tenant's prefix
}
message GetBinaryRequest {
  string hash = 1;
}
message GetBinaryChunk {
  bytes chunk = 1;
}
message BinaryExistsRequest {
  string hash = 1;
}
message DeleteBinaryRequest {
  string hash = 1;
}
// ttl_seconds <= 0 is treated server-side as "use the default TTL".
message PresignGetRequest {
  string hash = 1;
  int64 ttl_seconds = 2;
}
message PresignGetResponse {
  string url = 1;
}

// --- NodeSearch write path (Phase 4 Gate A) -------------------------------------------
//
// One XP-shipped index document, mirroring spi.IndexDocumentRecord(id, analyzer,
// Map<String, Collection<Object>> fields) 1:1 -- with the map expressed as a REPEATED FIELD
// LIST rather than a proto map<string, ...>, for two reasons: proto maps cannot have repeated
// values, and map iteration order is unspecified, whereas the indexer's bulk body must be
// deterministic (BUILD-PHASE-4.md "items the work order does not account for" #5: today's
// HashSet-backed request JSON varies across JVM runs and breaks wire-level golden files).
//
// Field NAMES are XP's CANONICAL vocabulary, exactly as IndexItem.getPath() produces them
// (`data.title`, `data.title._analyzed`, `_permissions.read`, ...). The nodb-specific physical
// renaming -- the `_text` postfix for the bare text variant (D1/blocker 1) and `_analyzed` ->
// `_fulltext` (D1b) -- happens SERVER-SIDE in IndexDocumentProjection, not on the wire. That
// keeps this message a faithful mirror of the SPI record (so the XP-side client stays a pure
// serializer with no vocabulary knowledge), keeps ONE copy of the postfix table next to the
// mapping resource that declares the templates and next to the translator that will resolve
// field names from Gate C, and -- because what is stored is the canonical input rather than the
// projected output -- keeps a projection bump replayable from the stored documents.
message IndexDoc {
  string id = 1;                    // XP node id. The OpenSearch _id is composite: <id>@<branch> (D10).
  string analyzer = 2;              // optional per-document analyzer override; empty = index default
  repeated IndexField fields = 3;
}
message IndexField {
  string name = 1;
  repeated IndexValue values = 2;
}
// Typed on purpose: the mapping depends on it (`*._number` is a double, `*._datetime` a date),
// and a single JSON-ish "string or number" would coerce a timestamp into a keyword or turn an
// integral long into a double on every round trip -- silently breaking _orderby parity.
// Instants ride as epoch millis, which is exactly the precision an ES 2.4 `date` stored, and the
// mapping lists `epoch_millis` first in its date format for that reason.
message IndexValue {
  oneof value {
    string string_value = 1;
    double double_value = 2;
    int64 long_value = 3;
    bool bool_value = 4;
    int64 instant_millis = 5;
  }
}
message IndexDocumentsRequest {
  string repo_id = 1;
  string branch = 2;               // CASE-PRESERVED: it becomes the `_branch` keyword field verbatim
  repeated IndexDoc documents = 3;
}
message DeleteDocumentsRequest {
  string repo_id = 1;
  string branch = 2;
  repeated string node_ids = 3;
}
// Separate from Ack only because the field means something specific here: the max outbox seq this
// call committed, which is exactly what the caller passes back to AwaitRefresh.
message IndexAck {
  uint64 outbox_seq = 1;
}

// RefreshMode.SEARCH (DESIGN.md §3.3): block until the indexer's checkpoint reaches `seq`, then
// issue an OpenSearch refresh on the affected indices. STORAGE is not on the wire at all -- it is
// a client-side no-op, because Postgres transactional visibility is strictly stronger than an ES
// refresh.
//
// `repo_ids` empty = refresh every index of this tenant. Refreshing only what the caller wrote is
// the point of the field: a whole-tenant refresh on a shared cell is a noisy-neighbour operation.
// `timeout_millis` <= 0 = server default; exceeding it is DEADLINE_EXCEEDED, never a rollback --
// the write IS committed and durable, it is only not yet searchable.
message AwaitRefreshRequest {
  uint64 seq = 1;
  repeated string repo_ids = 2;
  int64 timeout_millis = 3;
}
message CreateSearchIndexRequest {
  string repo_id = 1;
}
message DeleteSearchIndexRequest {
  string repo_id = 1;
}
message ReindexRequest {}
message TaskHandle {}

// Either an inline byte payload (new content) or a bare hash the caller believes NoDB
// already has (dedup — avoids re-sending bytes for content stored by an earlier write).
message PayloadRef {
  oneof ref {
    bytes inline = 1;
    string hash = 2;
  }
}

message CreateRepositoryRequest {
  string repo_id = 1;
  string settings_json = 2; // optional; empty/absent -> engine default '{}'
  // No `mappings` field: spi.RepositoryStorageAdmin#createIndex's Map<IndexType,
  // IndexMapping> parameter is a genuine ES-only concept (Postgres's node_version/
  // branch_entry columns are static DDL, not per-repo mappings) — permanently N/A for
  // NoDB, the XP-side client drops it, never a to-do.
}
message DeleteRepositoryRequest {
  string repo_id = 1;
}
message RepositoryExistsRequest {
  string repo_id = 1;
}
message ListRepositoriesRequest {}
message RepositoryInfo {}
message StatsRequest {}
message RepositoryStats {}
// Thin events: identity + metadata, never payloads or diffs (notify-then-fetch).
// At-least-once, seq-ordered; consumers dedup by seq and resume via cursor.
message WatchRequest {
  uint64 cursor = 1;            // resume after this outbox seq; 0 = from now
  string consumer_id = 2;       // registered cursor (trim protection, resync detection)
  repeated Scope scopes = 3;    // optional repo/branch/path-prefix filters
}
message Scope { string repo = 1; string branch = 2; string path_prefix = 3; }
message ChangeEvent {
  uint64 seq = 1;
  string repo = 2;
  string branch = 3;
  string node_id = 4;
  string version_id = 5;        // enough for conflict detection + lazy fetch
  string node_path = 6;
  string prev_path = 7;         // set on moves
  string op = 8;                // CREATED | UPDATED | DELETED | MOVED | PUSHED | ...
  int64  ts_millis = 9;
}
// versions + branch entries + optional commit + payloads (inline bytes for new hashes,
// hash-only for known content). repo_id is the only addressing field a caller supplies —
// tenant comes from the token, never from this message.
message WriteBatchRequest {
  string repo_id = 1;
  repeated PayloadRef payloads = 2;
  repeated Version versions = 3;
  repeated BranchEntry branch_entries = 4;
  Commit commit = 5; // optional (proto3 message-field presence; absent -> no commit row)
}
message WriteBatchResponse {
  uint64 outbox_seq = 1;                // for awaitRefresh (read-your-writes)
  repeated string need_payload = 2;     // unknown hashes — inline and retry
}
message DumpRequest {}
message DumpChunk {}
message ExportRequest {}
message ExportChunk {}
message SnapshotRequest {}
message RestoreRequest {}
message ListSnapshotsRequest {}
message SnapshotInfo {}
message DeleteSnapshotsRequest {}
