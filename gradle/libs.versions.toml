# NoDB client (Phase 1 Gate B, modules/core/core-storage-nodb-client) — versions kept in
# sync with nodb/gradle/libs.versions.toml (no cross-build artifact publishing in Phase 1,
# so the client module vendors nodb/proto/nodb.proto and generates its own stubs).
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
# grpc-protobuf's own POM depends on this with <scope>runtime</scope> (io.grpc.protobuf.ProtoUtils's
# marshaller delegates to io.grpc.protobuf.lite.ProtoLiteUtils at the bytecode level), so it never
# lands on Gradle's compileClasspath transitively -- and core-storage-nodb-client/build.gradle's bnd
# Private-Package embedding scans the compile buildpath, not runtimeClasspath (Phase 1 Gate D
# finding: caught booting a real XP instance, "NoClassDefFoundError: io/grpc/protobuf/lite/ProtoLiteUtils"
# -- unreachable from unit/itest, which never activate the OSGi bundle). Declared explicitly here so
# it's embedded like every other grpc private package.
grpc-protobuf-lite = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
grpc-util = { module = "io.grpc:grpc-util", version.ref = "grpc" }
# grpc-core's POM also depends on this with <scope>runtime</scope> (grpc-core's
# ManagedChannelImpl actively calls io.perfmark.PerfMark, not merely an optional hook) --
# same compileClasspath-vs-runtimeClasspath bnd buildpath gap as grpc-protobuf-lite above
# (Phase 1 Gate D finding: "ClassNotFoundException: io.perfmark.PerfMark not found").
perfmark-api = { module = "io.perfmark:perfmark-api", version = "0.27.0" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation" }

# Phase 1 Gate C (nodb/BUILD-PHASE-1.md): itest-core's testFixtures boots the REAL NoDB
# server+engine (files() dependency on nodb/{engine,server}/build/libs/*.jar -- no
# cross-build project dependency, matching nodb's own "no cross-build artifact
# publishing in Phase 1" posture) to run the curated itest subset against it. These are
# that server's runtime dependencies (versions kept in sync with
# nodb/gradle/libs.versions.toml), needed on itest-core's testFixtures/test classpath
# alongside the jars themselves.
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
nodb-java-jwt = { module = "com.auth0:java-jwt", version.ref = "nodb-java-jwt" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[bundles]
grpc-client = ["grpc-netty-shaded", "grpc-protobuf", "grpc-protobuf-lite", "grpc-stub", "grpc-util", "perfmark-api"]
nodb-testcontainers = ["testcontainers-postgresql", "testcontainers-junit-jupiter"]

[plugins]
