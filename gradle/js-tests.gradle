/**
 * Applied to modules whose tests execute JavaScript (see jsTestProjects in the root build script).
 *
 * Such tests must pass on every supported script engine: the default `test` task runs them with
 * the engine from the `xp.script-engine` project property (Nashorn unless overridden), and the
 * additional `testGraalJs` task repeats them with GraalJS. Both are part of `check`.
 */

dependencies {
    // The GraalJS language implementation must be on the test runtime classpath; script-impl itself
    // only carries the polyglot API. Modules that depend on tools:testing now inherit it from there,
    // which is what lets an application or library outside this build run its tests on both engines
    // without naming a GraalVM version; script-impl and portal-impl do not, so it stays declared here.
    testRuntimeOnly libs.graalvm.js
}

def testGraalJs = tasks.register( 'testGraalJs', Test ) {
    group = 'verification'
    description = 'Runs tests with the GraalJS script engine.'

    useJUnitPlatform {
        excludeTags 'elasticsearch'
    }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    systemProperty 'java.awt.headless', 'true'
    systemProperty 'xp.script-engine', 'GraalJS'
    maxHeapSize = '2G'

    doFirst {
        jvmArgs += ["-javaagent:${configurations.mockitoAgent.asPath}", "-XX:TieredStopAtLevel=1"]
    }

    shouldRunAfter test
}

check.dependsOn( testGraalJs )

// CI runs `gradlew ci`, which reaches test tasks through jacocoMergedReport -> each project's
// jacocoTestReport -> test, and never through a per-project `check`. Hanging the GraalJS run off
// the report task is therefore what makes it execute in CI at all; `dependsOn`, not
// `mustRunAfter`, because ordering alone never pulls a task into the graph.
tasks.named( 'jacocoTestReport' ) {
    dependsOn( testGraalJs )
}
