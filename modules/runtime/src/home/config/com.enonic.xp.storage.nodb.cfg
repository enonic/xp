# NoDB storage backend client (Phase 1, modules/core/core-storage-nodb-client). Commented
# out by default: this PID is only read if this file is uncommented/present, and even then
# the client only activates when backend=nodb -- a config-less (or backend=elasticsearch)
# boot is unaffected, keeping the elasticsearch-backed storage components as the sole
# NodeStore/RepositoryStorageAdmin providers (see NodbStorageClient's class javadoc).
#
# backend=nodb
# nodbEndpoint=localhost:7070
# nodbToken must carry 'operator' scope, not 'runtime': XP calls repository
# lifecycle RPCs (create/delete) as part of ordinary operation (e.g. project creation),
# and those RPCs require operator scope server-side. Mint via
# NodbTokenTool --tenant <t> --scope operator.
# nodbToken=${env.NODB_TOKEN}
