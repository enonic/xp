# Authentication flows can be restricted per id provider: default and/or enabled[=flow,flow...].
# Flows: login (interactive, web connector only), autologin (non-interactive, e.g. tokens or basic
# authentication), forced (reject unauthenticated requests upfront; never enabled by default).
# mapping.c.host = enonic.com
# mapping.c.source = /
# mapping.c.target = /
# mapping.c.idProvider.myidprovider = default&enabled=login,autologin

# A mapping applies to the web (xp) connector unless other connectors are listed explicitly:
# api (management port) and status (statistics port). Only non-interactive flows work there.
# mapping.mgmt.host = mgmt.enonic.com
# mapping.mgmt.source = /
# mapping.mgmt.target = /
# mapping.mgmt.connector = api
# mapping.mgmt.idProvider.myidprovider = default&enabled=autologin,forced
