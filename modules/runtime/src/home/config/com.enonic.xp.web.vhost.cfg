# Authentication flows can be restricted per id provider: default and/or enabled[=flow,flow...].
# Flows: login (interactive, web endpoint only), autologin (non-interactive, e.g. tokens or basic
# authentication).
# mapping.c.host = enonic.com
# mapping.c.source = /
# mapping.c.target = /
# mapping.c.idProvider.myidprovider = default&enabled=login,autologin

# A mapping applies to the web endpoint unless another endpoint is named explicitly:
# management (management API port) or statistics (statistics API port). Only non-interactive
# flows work on those endpoints. The optional allow list of principals is checked before requests
# pass through the vhost: unauthenticated requests get 401, others without any listed principal 403.
# mapping.stats.host = stats.enonic.com
# mapping.stats.source = /
# mapping.stats.target = /
# mapping.stats.endpoint = statistics
# mapping.stats.idProvider.myidprovider = default&enabled=autologin
# mapping.stats.allow = role:system.admin
