# mapping.mgmt.context.api.server\:task.verbs = *

# context.api.filter limits the APIs a mapping exposes, with the syntax of the application filter in com.enonic.xp.app.cfg:
# comma separated <application>:<api> patterns, a trailing * matches any key with that prefix, a leading ! rejects, the first
# matching pattern decides and an API no pattern matches is rejected. Rejected APIs are treated as not existing on every path
# of the mapping, even when mounted. Without it, every mounted API is reachable. A verbs setting for a rejected API has no
# effect. Site media links point at media:image and media:attachment, so a site mapping with a filter must accept them.
# mapping.c.context.api.filter = media:*, com.example.app:*
# mapping.mgmt.context.api.filter = !server:dump, server:*
