#
# Security policy for the pull verb of the server:app management API
# (/server:app/pull, alias /server:app/installUrl). It applies regardless of
# the virtual host a request arrives on; a virtual host can only withhold pull
# with its verbs setting.
#
# Comma-separated wildcard patterns of URLs pull may install from.
# A trailing * matches any suffix; otherwise the pattern is matched exactly.
# The default allows installs from any https URL.
# Set to an empty string to disable pull entirely.
#
# Examples:
#   pull.allowedUrls = https://repo.enonic.com/public/*, https://my.cdn.com/apps/*
#   pull.allowedUrls = http://*, https://*      # allow any http(s) URL
#
# pull.allowedUrls = https://*

#
# When true (default), a SHA512 checksum is required for every pull request.
# Set to false to allow installs without a checksum (not recommended).
#
# pull.checksumRequired = true

#
# The legacy keys installUrl.allowedUrls and installUrl.checksumRequired are
# still read and are used when the corresponding pull.* key is absent.
#
