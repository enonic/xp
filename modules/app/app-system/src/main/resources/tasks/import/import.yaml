kind: "Task"
description: "Import task"
form:
  - type: "TextLine"
    name: "exportName"
    label: "Export name"
    occurrences:
      min: 1
      max: 1
  - type: "TextLine"
    name: "repository"
    label: "Repository ID"
    occurrences:
      min: 1
      max: 1
  - type: "TextLine"
    name: "branch"
    label: "Branch"
    occurrences:
      min: 1
      max: 1
  - type: "TextLine"
    name: "nodePath"
    label: "Node path"
    occurrences:
      min: 1
      max: 1
  - type: "CheckBox"
    name: "importWithIds"
    label: "Keep node ids"
    occurrences:
      min: 0
      max: 1
  - type: "CheckBox"
    name: "importWithPermissions"
    label: "Keep permissions"
    occurrences:
      min: 0
      max: 1
  - type: "TextLine"
    name: "xslSource"
    label: "XSLT file"
    occurrences:
      min: 0
      max: 1
# xslParams: an optional set of XSLT parameters, passed as task data (no form item type describes a free-form set).
