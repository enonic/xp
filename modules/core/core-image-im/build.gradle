dependencies {
    implementation project( ':core:core-internal' )
    testFixturesApi project( ':core:core-internal' )
    testImplementation libs.felix.framework
    testImplementation libs.felix.scr
    testImplementation libs.osgi.util.promise
    testImplementation libs.osgi.util.function
}

configurations {
    osgiTestBundles { transitive = false }
}
dependencies {
    osgiTestBundles libs.felix.scr
    osgiTestBundles libs.osgi.util.promise
    osgiTestBundles libs.osgi.util.function
}

tasks.named( 'test' ) {
    dependsOn tasks.named( 'jar' )
    doFirst {
        systemProperty 'imagemagick.bundle', tasks.named( 'jar' ).get().archiveFile.get().asFile.absolutePath
        systemProperty 'imagemagick.osgi.bundles', configurations.osgiTestBundles.asPath
        systemProperty 'imagemagick.api.version', project.version.toString().replace( '-SNAPSHOT', '' )
    }
}

jar {
    bundle {
        bnd( 'Bundle-Name': 'Enonic XP Core - ImageMagick' )
    }
}

def imageMagickResources = layout.buildDirectory.dir( 'generated/imagemagick' )
def packageImageMagick = tasks.register( 'packageImageMagick' ) {
    inputs.files( fileTree( 'native' ) )
    outputs.dir( imageMagickResources )
    doLast {
        def sevenZip = providers.gradleProperty( 'imageMagickSevenZip' ).getOrElse(
            System.getProperty( 'os.name' ).startsWith( 'Windows' ) ?
                new File( System.getenv( 'ProgramFiles' ), '7-Zip/7z.exe' ).path :
                '7zz' )
        delete( imageMagickResources )
        com.enonic.gradle.ImageMagickPackager.packageDistributions(
            file( 'native/distributions.json' ).toPath(),
            imageMagickResources.get().dir( 'native/imagemagick' ).asFile.toPath(),
            layout.buildDirectory.dir( 'imagemagick-downloads' ).get().asFile.toPath(), sevenZip )
    }
}
sourceSets.main.resources.srcDir( imageMagickResources )
tasks.named( 'processResources' ) {
    dependsOn packageImageMagick
}
