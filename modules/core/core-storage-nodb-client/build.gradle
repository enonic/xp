// NoDB client (Phase 1 Gate B, nodb/BUILD-PHASE-1.md): implements the storage SPI
// (core:core-storage-spi) over gRPC against a NoDB server. Generates its own client stubs
// from nodb/proto/nodb.proto — the ONE source of truth, read in place (Phase 4 gate P1,
// nodb/BUILD-PHASE-4.md); no vendored copy, and no cross-build artifact dependency on the
// separate nodb/ Gradle build.
plugins {
    id 'com.google.protobuf' version '0.10.0'
}

dependencies {
    implementation project( ':core:core-api' )
    implementation project( ':core:core-internal' )
    implementation project( ':core:core-storage-spi' )

    implementation libs.bundles.grpc.client
    implementation libs.protobuf.java
    compileOnly libs.javax.annotation.api
    testCompileOnly libs.javax.annotation.api

    testImplementation libs.grpc.inprocess
}

// The canonical schema lives in the separate nodb/ Gradle build's tree; the protobuf
// plugin's proto source set takes an arbitrary srcDir, so both builds' codegen reads the
// very same file. checkNoVendoredProto fails the build if a copy is re-introduced here.
def canonicalProtoDir = rootProject.layout.projectDirectory.dir( 'nodb/proto' )

sourceSets.main.proto.srcDir canonicalProtoDir

tasks.register( 'checkNoVendoredProto' ) {
    def vendoredDir = layout.projectDirectory.dir( 'src/main/proto' ).asFile
    def canonical = canonicalProtoDir.file( 'nodb.proto' ).asFile
    doLast {
        if ( !canonical.isFile() ) {
            throw new GradleException( "Canonical proto is missing: ${canonical}" )
        }
        def copies = vendoredDir.exists() ? fileTree( vendoredDir ).matching { include '**/*.proto' }.files : []
        if ( !copies.isEmpty() ) {
            throw new GradleException(
                "Vendored .proto copy found: ${copies.join( ', ' )}. " +
                "nodb/proto/nodb.proto is the ONE source of truth (gate P1, " +
                "nodb/BUILD-PHASE-4.md) -- both builds generate from it directly. " +
                "Delete the copy; do not re-introduce a hand-synchronized schema." )
        }
    }
}

tasks.named( 'generateProto' ) { dependsOn tasks.named( 'checkNoVendoredProto' ) }
tasks.named( 'check' ) { dependsOn tasks.named( 'checkNoVendoredProto' ) }

def protobufVersion = libs.versions.protobuf.get()
def grpcVersion = libs.versions.grpc.get()

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

// gRPC/protobuf are notoriously OSGi-hostile (grpc-netty-shaded bundles a shaded Netty
// under io.grpc.netty.shaded.*, protobuf-java ships as a plain non-OSGi jar). Rather than
// fight Bundle-ClassPath wiring, this bundle uses the same "repackage as private packages"
// technique as repack-elasticsearch/core-elasticsearch: the dependencies are on the
// (runtime) buildpath bnd scans, and Private-Package copies their actual classes into this
// bundle's jar. Every auto-detected import outside com.enonic.xp.* is optional rather than
// hand-pinning version ranges for each transitive package (same idiom as
// repack-elasticsearch) -- this is a self-contained bundle, not one that re-exports gRPC to
// the rest of the framework. See the inline comments below for the one deliberate carve-out
// (com.enonic.xp.* stays mandatory) and a known bnd wrinkle (a few harmless netty-shaded
// jctools packages get auto-exported regardless of the Export-Package instruction below).
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    bundle {
        bnd(
            'Bundle-Name': 'Enonic XP Core - Storage NoDB Client',
            '-nouses': 'true',
            // This bundle exports nothing (it only registers SCR services -- see
            // Provide-Capability). A handful of embedded netty-shaded/jctools
            // package-info.class files carry their own baked-in
            // org.osgi.annotation.bundle.Export bytecode annotation (carried over
            // unchanged by netty's shading process) -- bnd honors that unconditionally
            // and an all-negative Export-Package value (e.g. '!*') is treated as "no
            // instruction given", NOT "export nothing", so it has no effect. A bogus
            // placeholder package name is bnd's documented way to fully replace the
            // default/annotation-driven export detection with an explicit (empty) list.
            'Export-Package': 'com.enonic.xp.storage.nodb.internal.no_exports',
            // com.enonic.xp.* is a hard, mandatory dependency (this bundle implements
            // core-storage-spi's NodeStore/RepositoryStorageAdmin using core-api's
            // Branch/RepositoryId/IndexType/Configuration types) -- listed first, WITHOUT
            // resolution:=optional, so it isn't swept into the blanket optional catch-all
            // below, which exists only for gRPC/Netty's own long tail of optional codec
            // dependencies (brotli4j, zstd, lz4, bouncycastle, conscrypt, jboss-marshalling,
            // etc. -- real for Netty in general, never exercised by this client) that this
            // bundle deliberately does not embed (same idiom as repack-elasticsearch).
            'Import-Package': 'com.enonic.xp.*,*;resolution:=optional',
            // com.enonic.nodb.proto.v1.* (the generated stub classes) is NOT listed here:
            // it's this project's own compiled output (nodb/proto -> generateProto),
            // already included in the jar like any other project class -- listing it as a
            // Private-Package instruction only produces a bnd "no such package on the
            // classpath" warning, since that instruction is for embedding classes found on
            // the *dependency* buildpath, not the project's own sourceSet output.
            'Private-Package':
                'io.grpc.*' + ',' +
                // grpc-core's ManagedChannelImpl calls io.perfmark.PerfMark directly (not
                // an optional hook, despite perfmark-api being a <scope>runtime</scope>
                // dependency in grpc-core's own POM -- Phase 1 Gate D finding:
                // "ClassNotFoundException: io.perfmark.PerfMark", surfaced only once a real
                // gRPC call executes, i.e. never at OSGi activation time).
                'io.perfmark.*' + ',' +
                // grpc-protobuf-lite (needed so io.grpc.protobuf.ProtoUtils's marshaller,
                // which delegates to io.grpc.protobuf.lite.ProtoLiteUtils at the bytecode
                // level, actually resolves -- Phase 1 Gate D finding, see the
                // grpc-protobuf-lite entry in gradle/libs.versions.toml) transitively pulls
                // in protobuf-javalite, which declares the same com.google.protobuf
                // package as our own explicit full protobuf-java dependency (same class
                // names throughout, since javalite is a subset API of the full runtime).
                // Pin the split-package resolution explicitly rather than leave it to bnd's
                // default (a warning-only, classpath-order-dependent choice) -- this bundle
                // needs the FULL protobuf-java classes (Descriptors/reflection, used by the
                // generated non-lite proto message classes), and protobuf-java is listed
                // ahead of protobuf-javalite on this module's own dependency-declared
                // classpath order, so merge-first keeps the full runtime's copy of every
                // colliding class name.
                'com.google.protobuf.*;-split-package:=merge-first' + ',' +
                'META-INF.services.*;-split-package:=merge-first'
        )
    }
}
