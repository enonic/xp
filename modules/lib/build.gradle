plugins {
    id 'base'
    id 'com.github.node-gradle.node'
}

node {
    version = '24.11.1'
    download = true
}

def coreDir = layout.projectDirectory.dir( 'core' )
def xpDir = layout.projectDirectory.dir( 'xp' )

/* Clean */
clean {
    delete coreDir.dir( 'build' )
    delete xpDir.dir( 'build' )
}

/* Test */
tasks.register( 'lint', NpmTask ) {
    dependsOn tasks.named( 'npmInstall' )
    description = 'Lint TS, JS, and JSON'
    args = ['run', 'lint']
    inputs.file 'global.d.ts'
    inputs.file coreDir.file( 'index.d.ts' )
    inputs.file 'eslint.config.mjs'
    inputs.dir 'scripts'
    inputs.files( subprojects.collect {
        it.layout.projectDirectory.dir( 'src/main/resources/lib/xp' )
            .asFileTree.matching { include '**/*.ts', '**/*.js', '**/*.json' }
    } )
    outputs.file( layout.buildDirectory.file( '.eslintcache' ) )
}

check.dependsOn tasks.named( 'lint' )

tasks.register( 'testTypes', NpmTask ) {
    dependsOn tasks.named( 'npmInstall' )
    dependsOn tasks.named( 'prepareGlobalToPublish' )
    description = 'Type-test the public type definitions (tsd)'
    args = ['run', 'test:types']
    inputs.file 'global.d.ts'
    inputs.file coreDir.file( 'index.d.ts' )
    inputs.dir 'test'
    inputs.file layout.buildDirectory.file( 'npm/global.d.ts' )
}

check.dependsOn tasks.named( 'testTypes' )

tasks.register( 'testPackages', NpmTask ) {
    dependsOn tasks.named( 'npmInstall' )
    dependsOn tasks.named( 'prepareAllToPublish' )
    description = 'Type-check fixture apps that install the packed type packages with npm and pnpm'
    args = ['run', 'test:packages']
    inputs.dir 'test-packages'
    inputs.files( 'scripts/test-packages.mjs', 'scripts/packages.mjs', 'package-lock.json' )
    inputs.dir layout.buildDirectory.dir( 'npm' )
    inputs.dir coreDir.dir( 'build/npm' )
    inputs.dir xpDir.dir( 'build/npm' )
    inputs.files( subprojects.collect { it.layout.buildDirectory.dir( 'npm' ) } )
    outputs.file( layout.buildDirectory.file( 'test-packages/.ok' ) )
}

check.dependsOn tasks.named( 'testPackages' )

/* Configure & Build */
tasks.register( 'typescript', NpmTask ) {
    dependsOn tasks.named( 'npmInstall' )
    dependsOn tasks.named( 'prepareToPublish' )
    description = 'Create JS and DTS files from TS'
    args = ['run', 'build']

    inputs.file "global.d.ts"
    inputs.file coreDir.file( "index.d.ts" )
    inputs.file "tsconfig.build.json"
    inputs.file "tsconfig.json"
    inputs.files( subprojects.collect {
        it.layout.projectDirectory.dir( 'src/main/resources/lib/xp' )
            .asFileTree.matching { include '**/*.ts', '**/*.js', '**/*.json' }
    } )
    outputs.files( subprojects.collect {
        it.layout.buildDirectory.dir( 'typescript/lib/xp' ).map { d -> d.asFileTree.matching { include '**/*.js' }
        }
    } )
}

tasks.register( 'prepareToJsdoc', Copy ) {
    dependsOn tasks.named( 'typescript' )
    into layout.buildDirectory.dir( "js" )
    from( layout.projectDirectory ) {
        include "lib-*/build/typescript/lib/xp/*.js"
        eachFile { fcd -> fcd.relativePath = new RelativePath( true, fcd.relativePath.segments.drop( 3 ) ) }
    }
    into( "examples" ) {
        from layout.projectDirectory
        include "lib-*/src/main/resources/lib/xp/examples/**/*.js"
        eachFile { fcd -> fcd.relativePath = new RelativePath( true, fcd.relativePath.segments.drop( 5 ) ) }
    }
    includeEmptyDirs = false
}

tasks.register( 'jsdoc', NpmTask ) {
    description = 'Build JSDoc for libraries.'
    args = ['run', 'jsdoc']
    doLast {
        copy {
            from 'jsdoc/template/jsdoc-main.css'
            into layout.buildDirectory.dir( "resources/main/jsdoc/styles" )
        }
    }
    inputs.file( 'jsdoc/template/jsdoc-main.css' )
    inputs.dir( tasks.named( 'prepareToJsdoc', Copy ).map { it.destinationDir } )
    outputs.dirs( layout.buildDirectory.dir( "resources/main/jsdoc" ) )
}

/* Publish */
tasks.register( 'prepareGlobalToPublish', Copy ) {
    into layout.buildDirectory.dir( "npm" )
    from 'README.md'
    from 'global.d.ts'
}

tasks.register( 'prepareCoreToPublish', Copy ) {
    into "$coreDir/build/npm"
    from "$coreDir/README.md"
    from "$coreDir/index.d.ts"
}

tasks.register( 'prepareToPublish' ) {
    dependsOn tasks.named( 'prepareGlobalToPublish' )
    dependsOn tasks.named( 'prepareCoreToPublish' )
}

tasks.register( 'preparePackageManifests', NodeTask ) {
    dependsOn tasks.named( 'prepareToPublish' )
    description = 'Write package.json for every staged type package and stage the @enonic-types/xp meta package.'
    script = file( 'scripts/prepare-packages.mjs' )
    args = [version]
    inputs.property( 'version', version )
    inputs.files( 'scripts/prepare-packages.mjs', 'scripts/packages.mjs', 'xp/README.md' )
    inputs.files( 'global.d.ts', coreDir.file( 'index.d.ts' ) )
    inputs.files( subprojects.collect { it.layout.buildDirectory.dir( 'typescript/lib/xp' ) } )
    outputs.file( layout.buildDirectory.file( 'npm/package.json' ) )
    outputs.file( coreDir.file( 'build/npm/package.json' ) )
    outputs.files( subprojects.collect { it.layout.buildDirectory.file( 'npm/package.json' ) } )
    outputs.dir( xpDir.dir( 'build/npm' ) )
}

tasks.register( 'prepareAllToPublish' ) {
    dependsOn tasks.named( 'prepareToPublish' )
    dependsOn tasks.named( 'preparePackageManifests' )
}

subprojects.each { sub ->
    sub.afterEvaluate {
        tasks.named( 'preparePackageManifests' ) {
            dependsOn sub.tasks.named( 'prepareToPublish' )
        }
        tasks.named( 'prepareAllToPublish' ) {
            dependsOn sub.tasks.named( 'prepareToPublish' )
        }
    }
}

tasks.register( 'packageJsdoc', Jar ) {
    dependsOn tasks.named( 'jsdoc' )
    from layout.buildDirectory.dir( "resources/main/jsdoc" )
    archiveClassifier.set( 'jsdoc' )
}

assemble.dependsOn tasks.named( 'packageJsdoc' )

publishing {
    publications {
        mavenDocs( MavenPublication ) {
            artifact tasks.named( 'packageJsdoc' )
        }
    }
}

subprojects { p ->
    apply plugin: 'com.github.node-gradle.node'

    tasks.register( 'prepareToTypescript', Copy ) {
        from( "src/main/resources" ) {
            include '**/*.ts'
            includeEmptyDirs = false
        }
        into layout.buildDirectory.dir( "typescript" )
    }

    parent.tasks.named( 'typescript' ).configure {
        dependsOn tasks.named( 'prepareToTypescript' )
    }

    tasks.named( 'processResources' ) {
        from( layout.buildDirectory.dir( "typescript" ) ) {
            include '**/*.js'
        }
        dependsOn parent.tasks.named( 'typescript' )
    }

    tasks.register( 'prepareToPublish', Copy ) {
        dependsOn tasks.named( 'processResources' )
        into layout.buildDirectory.dir( "npm" )
        from( 'README.md' )
        from( layout.buildDirectory.dir( "typescript/lib/xp" ) ) {
            include '*.d.ts'
        }
    }

    jar {
        exclude '**/*.ts'
    }

    plugins.withId( 'maven-publish' ) {
        tasks.named( 'publish' ).configure {
            dependsOn parent.tasks.named( 'prepareAllToPublish' )
        }
    }
}
