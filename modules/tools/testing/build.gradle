dependencies {
    api project( ':portal:portal-api' )
    api libs.jackson.databind
    implementation project( ':core:core-app' )
    implementation project( ':core:core-internal' )
    implementation testFixtures( project( ':script:script-impl' ) )
    implementation libs.junit.jupiter.api
    implementation libs.mockito.core
    implementation libs.slf4j.simple

    // the harness runs scripts on every supported engine, and script-impl carries only the
    // polyglot API — so consumers inherit the GraalJS language implementation from here
    runtimeOnly libs.graalvm.js
}
