dependencies {
    testImplementation project( ':core:core-content' )
    testImplementation project( ':core:core-audit' )
    testImplementation project( ':core:core-repo' )
    testImplementation project( ':core:core-storage-spi' )
    testImplementation project( ':core:core-schema' )
    testImplementation project( ':core:core-event' )
    testImplementation project( ':core:core-media' )
    testImplementation project( ':core:core-project' )
    testImplementation project( ':core:core-app' )

    testImplementation( testFixtures( project( ":core:core-api" ) ) )
    testImplementation( testFixtures( project( ":core:core-blobstore" ) ) )
    testImplementation( testFixtures( project( ":core:core-security" ) ) )
    testImplementation( testFixtures( project( ":core:core-task" ) ) )
    testImplementation( testFixtures( project( ":core:core-internal" ) ) )
    testImplementation( testFixtures( project( ":core:core-app" ) ) )

    testImplementation( testFixtures( project( ":itest:itest-core" ) ) )

    // Phase 4 Gate B: the nodb harness. The nodb-client types (NodbBinaryBlobStore) are used
    // directly by AbstractContentServiceTest/AbstractIssueServiceTest, and itest-core declares
    // the client as testFixturesImplementation -- i.e. not exported -- so it must be declared
    // here too rather than inherited. The nodb engine/server jars come along on the runtime
    // classpath via the fixtures, which is what NodbTestCluster loads NodbServer from.
    testImplementation project( ':core:core-storage-nodb-client' )

    testImplementation libs.hazelcast.hazelcast
    testImplementation libs.felix.framework
}

tasks.register( 'integrationTest', Test ) {
    usesService( gradle.sharedServices.registrations.named( "integration" ).get().service )
    description = 'Runs integration tests.'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'elasticsearch'
    }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    systemProperty 'java.awt.headless', 'true'
    maxHeapSize = '2G'

    // Phase 4 Gate F: same locale pin as itest-core's integrationTest -- ES 2.4's DUCET fallback
    // resolves to Locale.getDefault(), so an unpinned suite is host-dependent (nodb/FINDINGS.md #2).
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'

    // Phase 4 Gate B: -Dxp.itest.storage=nodb is a system property of the GRADLE JVM and is not
    // automatically visible to the forked test JVM this task spawns. Only set when actually
    // passed, so a plain `integrationTest` run stays byte-identical to before this gate.
    if ( System.getProperty( 'xp.itest.storage' ) != null )
    {
        systemProperty 'xp.itest.storage', System.getProperty( 'xp.itest.storage' )
    }
    if ( System.getProperty( 'xp.itest.opensearch' ) != null )
    {
        systemProperty 'xp.itest.opensearch', System.getProperty( 'xp.itest.opensearch' )
    }

    // Required for testcontainers inside the forked JVM: the Gradle daemon's environment is
    // frozen at startup, so DOCKER_HOST on the gradlew invocation never reaches this JVM, and
    // docker-java 3.4.0 defaults to an API version engines >= 29 reject.
    def dockerDesktopSock = file( "${System.getProperty( 'user.home' )}/.docker/run/docker.sock" )
    if ( System.getenv( 'DOCKER_HOST' ) == null && dockerDesktopSock.exists() )
    {
        environment 'DOCKER_HOST', "unix://${dockerDesktopSock.absolutePath}"
        environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
    }
    systemProperty 'api.version', '1.44'

    shouldRunAfter test
}

check.dependsOn( tasks.named( 'integrationTest' ) )

tasks.named( 'jacocoTestReport' ) {
    dependsOn( tasks.named( 'integrationTest' ) )
    executionData.from = fileTree( layout.buildDirectory ).include( "/jacoco/*.exec" )
}
